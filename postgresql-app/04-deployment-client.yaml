apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-client-deployment
  namespace: postgresql-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgresql-client
  template:
    metadata:
      labels:
        app: postgresql-client
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: postgresql-client
      containers:
      - name: psql
        image: docker.io/library/postgres:18
        command: ["sleep", "infinity"]
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
          - name: PGHOST
            value: "$postgres_server_name.postgres.database.azure.com"
          - name: PGPORT
            value: "6432"
          - name: PGDATABASE
            value: "$postgres_db_name"
          - name: PGSSLMODE
            value: "require"
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: postgresql-app-db
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql-app-db
                key: password